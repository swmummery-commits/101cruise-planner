<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ship Spotlight | 101cruise</title>
  <meta name="description" content="Explore this cruise ship with 101cruise.">
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    :root{--ink:#16212a;--muted:#66727c;--green:#16816b;--paper:#f5f6f5;--line:#dfe4e2;--white:#fff;--soft:#eef4f1}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.55}a{color:inherit}.shell{max-width:1180px;margin:0 auto;padding:0 22px 64px}.topbar{height:68px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:23px;letter-spacing:-.5px}.brand span{color:var(--green)}.toplink{text-decoration:none;font-size:14px;color:var(--muted)}.hero{position:relative;border-radius:20px;overflow:hidden;background:#23313a;min-height:520px;display:flex;align-items:end;box-shadow:0 18px 50px rgba(20,30,36,.15)}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.06) 25%,rgba(0,0,0,.75) 100%)}.hero-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hero-copy{position:relative;z-index:1;color:white;padding:42px;max-width:760px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.7px;text-transform:uppercase;color:#8ee0ce}.hero h1{font-size:54px;line-height:1.02;margin:8px 0 8px;letter-spacing:-1.7px}.line-name{font-size:20px;opacity:.92}.intro{font-size:19px;line-height:1.55;margin:18px 0 0;max-width:680px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:24px 0}.stat{background:var(--white);padding:19px 14px;text-align:center}.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}.stat-value{font-size:23px;font-weight:800;margin-top:3px}.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.7fr);gap:24px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:28px}.card h2{font-size:28px;margin:0 0 16px;letter-spacing:-.6px}.highlights{display:grid;gap:12px}.highlight{background:var(--soft);border-radius:10px;padding:15px 17px;display:flex;gap:12px}.highlight:before{content:"✓";color:var(--green);font-weight:900}.tip{border-left:4px solid var(--green);padding-left:16px}.gallery-head,.sailings-head{display:flex;justify-content:space-between;align-items:end;gap:18px;margin:42px 0 15px}.gallery-head h2,.sailings-head h2{margin:0;font-size:31px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.gallery img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;display:block}.sailings{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.sailing{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;text-decoration:none;transition:transform .15s ease,box-shadow .15s ease}.sailing:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(20,30,36,.08)}.sailing-destination{font-weight:800;font-size:18px}.sailing-meta{color:var(--muted);font-size:14px;margin-top:5px}.sailing-fare{color:var(--green);font-weight:800;margin-top:12px}.empty{padding:30px;background:white;border:1px solid var(--line);border-radius:12px;color:var(--muted)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.button{display:inline-block;text-decoration:none;background:var(--ink);color:white;padding:12px 17px;border-radius:7px;font-weight:700;font-size:14px}.button.secondary{background:var(--soft);color:var(--ink)}.loading,.error{max-width:760px;margin:80px auto;background:white;border:1px solid var(--line);border-radius:14px;padding:30px;text-align:center}.error{display:none}.footer{color:var(--muted);font-size:12px;text-align:center;padding:30px 0 0}
    @media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}.gallery,.sailings{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:43px}}
    @media(max-width:600px){.shell{padding:0 13px 45px}.topbar{height:58px}.hero{min-height:450px;border-radius:14px}.hero-copy{padding:25px}.hero h1{font-size:37px}.intro{font-size:17px}.stats{grid-template-columns:repeat(2,1fr)}.gallery,.sailings{grid-template-columns:1fr}.card{padding:21px}.gallery-head,.sailings-head{margin-top:32px}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><div class="brand">101<span>cruise</span></div><a class="toplink" href="/cruise-finder">Find a cruise</a></header>
    <div id="shipLoading" class="loading">Loading ship…</div>
    <div id="shipError" class="error"><h2>Ship page unavailable</h2><p id="shipErrorText">This Ship Spotlight could not be loaded.</p><a class="button" href="/cruise-finder">Explore cruises</a></div>
    <main id="shipPage" hidden></main>
    <footer class="footer">101cruise · Cruise information can change. Always confirm final details before booking.</footer>
  </div>
  <script src="/js/ship-spotlight-public.js?v=20260912a"></script>
</body>
</html>
