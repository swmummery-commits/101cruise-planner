<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ship Spotlight | 101cruise</title>
  <meta name="description" content="Explore this cruise ship with 101cruise.">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/css/ci-ship-presentation.css?v=20260913a">
  <link rel="stylesheet" href="/css/ship-feature-multiline.css?v=20260914a">
  <link rel="stylesheet" href="/css/ship-spotlight-public.css?v=20260913a">
  <link rel="stylesheet" href="/css/ship-spotlight-public-refinements.css?v=20260913a">
</head>
<body>
  <header class="public-site-header">
    <div class="public-site-header-inner">
      <a class="public-brand" href="/">101CRUISE by Paul McAllister</a>
      <nav class="public-nav" aria-label="101CRUISE links">
        <a href="/cruise-finder">Cruise Finder</a>
        <a class="public-nav-primary" href="/cruise-finder">Find a Cruise</a>
      </nav>
    </div>
  </header>

  <main class="public-ship-shell">
    <div id="shipLoading" class="public-loading">Loading ship…</div>
    <div id="shipError" class="public-error">
      <h2>Ship page unavailable</h2>
      <p id="shipErrorText">This Ship Spotlight could not be loaded.</p>
      <a class="planner-button secondary" href="/cruise-finder">Explore cruises</a>
    </div>
    <article id="shipPage" hidden>
      <div id="shipPresentationMount"></div>
      <div id="shipPublicExtras"></div>
    </article>
  </main>

  <div id="shipLightbox" class="public-lightbox" aria-hidden="true">
    <button class="public-lightbox-close" type="button" aria-label="Close image">×</button>
    <img id="shipLightboxImage" src="" alt="">
  </div>

  <footer class="public-footer">101CRUISE · Cruise information can change. Always confirm final details before booking.</footer>

  <script src="/js/ci-ship-feature-icons.js?v=ship-feature-icons-v14"></script>
  <script src="/js/ci-ship-facilities.js?v=ship-facilities-v3"></script>
  <script src="/js/ci-ship-stateroom-reconciliation.js?v=stateroom-reconcile-v1"></script>
  <script src="/js/ci-ship-spec-scale.js?v=20260913a"></script>
  <script src="/js/ci-ship-presentation.js?v=20260913a"></script>
  <script src="/js/ship-spotlight-preview-bridge.js?v=20260913a"></script>
  <script src="/js/ship-spotlight-public.js?v=20260913d"></script>
</body>
</html>
