[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions."search-current-cruises"]
  # Departure-port matching reads ports-catalogue.csv from disk at runtime.
  included_files = [
    "data/ports/ports-catalogue.csv",
    "data/cruise-finder-v2/ci-cruise-lines-snapshot.csv",
    "data/cruise-finder-v2/ci-cruise-ships-snapshot.csv"
  ]

[functions."research-content-generate"]
  # Research runs Brave + source fetches + OpenAI; allow longer than default.
  timeout = 60

[functions."cruise-line-audit"]
  # Fleet audit: Brave + page fetch + optional LLM name extract.
  timeout = 60

[functions."cruise-discovery"]
  # Discovery: Brave + official page fetch per cruise line.
  timeout = 60

[functions."cruise-discovery-cron"]
  # Legacy weekly orchestrator — expire + full discovery wave (disabled via CRUISE_DISCOVERY_AUTOMATION_ENABLED).
  schedule = "0 6 * * 1"
  timeout = 60

[functions."hal-weekly-maintenance-cron"]
  # Thin Scheduled Function launcher — Sunday 18:00 UTC (Monday 02:00 Perth).
  schedule = "0 18 * * 0"
  timeout = 26

[functions."hal-weekly-maintenance-background"]
  # Background worker for HAL weekly maintenance. NOT scheduled.
  timeout = 900
  included_files = [
    "data/ports/ports-catalogue.csv",
    "data/cruise-finder-v2/ci-cruise-lines-snapshot.csv",
    "data/cruise-finder-v2/ci-cruise-ships-snapshot.csv"
  ]

[functions."celebrity-weekly-maintenance-cron"]
  # Thin Scheduled Function launcher — Sunday 19:00 UTC (Monday 03:00 Perth).
  schedule = "0 19 * * 0"
  timeout = 26

[functions."celebrity-weekly-maintenance-background"]
  # Background worker for Celebrity weekly maintenance. NOT scheduled.
  timeout = 900
  included_files = [
    "data/ports/ports-catalogue.csv",
    "data/cruise-finder-v2/ci-cruise-lines-snapshot.csv",
    "data/cruise-finder-v2/ci-cruise-ships-snapshot.csv"
  ]

[functions."princess-weekly-maintenance-cron"]
  # Unscheduled Netlify diagnostic only. Authoritative Princess APPLY is GitHub
  # Actions on self-hosted princess-local-mac (Sunday 20:00 UTC / Monday 04:00 Perth).
  timeout = 26

[functions."explora-weekly-maintenance-cron"]
  # Thin Scheduled Function launcher — Sunday 21:00 UTC / Monday 05:00 Australia/Perth.
  # Must stay a short launcher: Netlify Scheduled Functions hard-cap at ~30s.
  # Long-running work is dispatched to explora-weekly-maintenance-background.
  schedule = "0 21 * * 0"
  timeout = 26

[functions."explora-weekly-maintenance-background"]
  # Background worker for Explora weekly maintenance (Netlify background ~15 min).
  # NOT scheduled. Invoked only by the thin launcher (or authorised manual dispatch).
  # Filename -background suffix enables background mode.
  # Include catalogue CSVs — background bundles do not always preserve repo-relative data paths.
  included_files = [
    "data/ports/ports-catalogue.csv",
    "data/cruise-finder-v2/ci-cruise-lines-snapshot.csv",
    "data/cruise-finder-v2/ci-cruise-ships-snapshot.csv"
  ]

[functions."seabourn-weekly-maintenance-cron"]
  # Seabourn weekly launcher — Sunday 22:00 UTC / Monday 06:00 Perth.
  schedule = "0 22 * * 0"
  timeout = 26

[functions."seabourn-weekly-maintenance-background"]
  timeout = 900
  included_files = [
    "data/ports/ports-catalogue.csv",
    "data/cruise-finder-v2/ci-cruise-lines-snapshot.csv",
    "data/cruise-finder-v2/ci-cruise-ships-snapshot.csv"
  ]

[functions."princess-discovery-smoke"]
  timeout = 900

[functions."royal-caribbean-discovery-smoke"]
  # Bounded connectivity smoke (probe + fleet). No authoritative enumeration.
  timeout = 26

[functions."royal-caribbean-weekly-maintenance-cron"]
  # Royal Caribbean weekly launcher — Sunday 23:00 UTC / Monday 07:00 Perth (after Seabourn 22:00).
  schedule = "0 23 * * 0"
  timeout = 26

[functions."royal-caribbean-weekly-maintenance-launcher"]
  timeout = 26

[functions."royal-caribbean-weekly-maintenance-background"]
  # Background worker for Royal Caribbean weekly maintenance (dry-run on Netlify).
  timeout = 900
  included_files = [
    "data/ports/ports-catalogue.csv",
    "data/cruise-finder-v2/ci-cruise-lines-snapshot.csv",
    "data/cruise-finder-v2/ci-cruise-ships-snapshot.csv"
  ]

[functions."norwegian-weekly-maintenance-cron"]
  # Norwegian weekly launcher — Monday 00:00 UTC / Monday 08:00 Perth (after RC 23:00 Sunday).
  schedule = "0 0 * * 1"
  timeout = 26

[functions."norwegian-weekly-maintenance-background"]
  timeout = 900
  included_files = [
    "data/ports/ports-catalogue.csv",
    "data/cruise-finder-v2/ci-cruise-lines-snapshot.csv",
    "data/cruise-finder-v2/ci-cruise-ships-snapshot.csv"
  ]

[functions."carnival-weekly-maintenance-cron"]
  # Carnival weekly launcher — Monday 01:00 UTC / Monday 09:00 Perth (after Norwegian 00:00 UTC).
  schedule = "0 1 * * 1"
  timeout = 26

[functions."carnival-weekly-maintenance-background"]
  timeout = 900
  included_files = [
    "data/ports/ports-catalogue.csv",
    "data/cruise-finder-v2/ci-cruise-lines-snapshot.csv",
    "data/cruise-finder-v2/ci-cruise-ships-snapshot.csv"
  ]

[functions."disney-weekly-maintenance-cron"]
  # Disney weekly launcher — Monday 02:00 UTC / Monday 10:00 Perth (after Carnival 01:00 UTC).
  schedule = "0 2 * * 1"
  timeout = 26

[functions."disney-weekly-maintenance-background"]
  timeout = 900
  included_files = [
    "data/ports/ports-catalogue.csv",
    "data/cruise-finder-v2/ci-cruise-lines-snapshot.csv",
    "data/cruise-finder-v2/ci-cruise-ships-snapshot.csv"
  ]

[functions."azamara-weekly-maintenance-cron"]
  # Azamara weekly launcher — Monday 03:00 UTC / Monday 11:00 Perth (after Disney 02:00 UTC).
  schedule = "0 3 * * 1"
  timeout = 26

[functions."azamara-weekly-maintenance-background"]
  timeout = 900
  included_files = [
    "data/ports/ports-catalogue.csv",
    "data/cruise-finder-v2/ci-cruise-lines-snapshot.csv",
    "data/cruise-finder-v2/ci-cruise-ships-snapshot.csv"
  ]

[functions."silversea-weekly-maintenance-cron"]
  # Silversea weekly launcher — Monday 04:00 UTC / Monday 12:00 Perth (after Azamara 03:00 UTC).
  schedule = "0 4 * * 1"
  timeout = 26

[functions."silversea-weekly-maintenance-background"]
  timeout = 900
  included_files = [
    "data/ports/ports-catalogue.csv",
    "data/cruise-finder-v2/ci-cruise-lines-snapshot.csv",
    "data/cruise-finder-v2/ci-cruise-ships-snapshot.csv"
  ]

[functions."seg-ship-sync"]
  # Refresh SEG Ship IDs from the live SEG Google Sheet every Tuesday at 15:00 Perth.
  schedule = "0 7 * * 2"
  timeout = 26

[functions."cruise-daily-expiry-cron"]
  # Daily sailed-cruise expiration — 17:30 UTC (01:30 Australia/Perth).
  schedule = "30 17 * * *"
  timeout = 300

[functions."reconcile-booking-documents"]
  # Daily Base44 booking document mirror reconciliation — 04:00 UTC (12:00 Perth).
  schedule = "0 4 * * *"
  timeout = 300

# itinerary-exceptions-digest schedule removed — journey-map extraction retired.
# Function file may remain for historical compatibility but must not be scheduled.

[functions."cruise-discovery-wave-background"]
  # Background wave: loops all cruise lines (Netlify background ~15 min).

[functions."hal-discovery-batch-background"]
  # Resumable HAL API batches — read-only by default.
  timeout = 60

[functions."hal-discovery-smoke"]
  # Synchronous HAL read-only smoke (max 3 pages, JSON response).
  timeout = 60

[functions."bulk-ship-images"]
  # ZIP download + hash + storage writes for ship image import.
  timeout = 60

[functions."port-image-finder"]
  # Port image discovery (Wikimedia / Pexels / Brave) and bulk enrichment batches.
  timeout = 120

[functions."route-map-generate"]
  # Route Object load/create + SVG + PNG rasterisation.
  # Prefer native @resvg/resvg-js; fall back to @resvg/resvg-wasm when the Linux
  # platform binary is missing from the Function bundle.
  timeout = 120
  external_node_modules = [
    "@resvg/resvg-js",
    "@resvg/resvg-js-linux-x64-gnu",
    "@resvg/resvg-wasm"
  ]
  included_files = [
    "node_modules/@resvg/resvg-js/**",
    "node_modules/@resvg/resvg-js-linux-x64-gnu/**",
    "node_modules/@resvg/resvg-wasm/**",
    "netlify/functions/fonts/**"
  ]

[functions."newsletter-mailchimp-assets"]
  # One newsletter image per invocation: download + resize + Mailchimp File Manager upload.
  timeout = 60
  external_node_modules = ["sharp"]
  included_files = [
    "node_modules/sharp/**",
    "node_modules/@img/**"
  ]

[functions."social-pack-generate"]
  # Weekly newsletter social pack: destination images + SVG → PNG + ZIP.
  timeout = 60
  external_node_modules = [
    "@resvg/resvg-js",
    "@resvg/resvg-js-linux-x64-gnu",
    "@resvg/resvg-wasm"
  ]
  included_files = [
    "node_modules/@resvg/resvg-js/**",
    "node_modules/@resvg/resvg-js-linux-x64-gnu/**",
    "node_modules/@resvg/resvg-wasm/**",
    "assets/fonts/social-pack/**",
    "assets/social-pack/**",
    "assets/101cruise-logo.png"
  ]


