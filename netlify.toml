[functions]
  directory = "netlify/functions"

[functions."research-content-generate"]
  # Research runs Brave + source fetches + OpenAI; allow longer than default.
  timeout = 60

[functions."cruise-line-audit"]
  # Fleet audit: Brave + page fetch + optional LLM name extract.
  timeout = 60

[functions."cruise-discovery"]
  # Discovery: Brave + official page fetch per cruise line.
  timeout = 60

[functions."cruise-discovery-cron"]
  # Legacy weekly orchestrator — expire + full discovery wave (disabled via CRUISE_DISCOVERY_AUTOMATION_ENABLED).
  schedule = "0 6 * * 1"
  timeout = 60

[functions."hal-weekly-maintenance-cron"]
  # HAL weekly official-source reconciliation — Sunday 18:00 UTC (Monday 02:00 Perth).
  schedule = "0 18 * * 0"
  timeout = 900

[functions."celebrity-weekly-maintenance-cron"]
  # Celebrity weekly official-source reconciliation — Sunday 19:00 UTC (Monday 03:00 Perth).
  schedule = "0 19 * * 0"
  timeout = 900

[functions."cruise-daily-expiry-cron"]
  # Daily sailed-cruise expiration — 17:30 UTC (01:30 Australia/Perth).
  schedule = "30 17 * * *"
  timeout = 300

[functions."reconcile-booking-documents"]
  # Daily Base44 booking document mirror reconciliation — 04:00 UTC (12:00 Perth).
  schedule = "0 4 * * *"
  timeout = 300

# itinerary-exceptions-digest schedule removed — journey-map extraction retired.
# Function file may remain for historical compatibility but must not be scheduled.

[functions."cruise-discovery-wave-background"]
  # Background wave: loops all cruise lines (Netlify background ~15 min).

[functions."hal-discovery-batch-background"]
  # Resumable HAL API batches — read-only by default.
  timeout = 60

[functions."hal-discovery-smoke"]
  # Synchronous HAL read-only smoke (max 3 pages, JSON response).
  timeout = 60

[functions."bulk-ship-images"]
  # ZIP download + hash + storage writes for ship image import.
  timeout = 60

[functions."route-map-generate"]
  # Route Object load/create + SVG + PNG rasterisation.
  # Prefer native @resvg/resvg-js; fall back to @resvg/resvg-wasm when the Linux
  # platform binary is missing from the Function bundle.
  timeout = 60
  external_node_modules = [
    "@resvg/resvg-js",
    "@resvg/resvg-js-linux-x64-gnu",
    "@resvg/resvg-wasm"
  ]
  included_files = [
    "node_modules/@resvg/resvg-js/**",
    "node_modules/@resvg/resvg-js-linux-x64-gnu/**",
    "node_modules/@resvg/resvg-wasm/**",
    "netlify/functions/fonts/**"
  ]

[functions."social-pack-generate"]
  # Weekly newsletter social pack: destination images + SVG → PNG + ZIP.
  timeout = 60
  external_node_modules = [
    "@resvg/resvg-js",
    "@resvg/resvg-js-linux-x64-gnu",
    "@resvg/resvg-wasm"
  ]
  included_files = [
    "node_modules/@resvg/resvg-js/**",
    "node_modules/@resvg/resvg-js-linux-x64-gnu/**",
    "node_modules/@resvg/resvg-wasm/**",
    "assets/fonts/social-pack/**",
    "assets/social-pack/**",
    "assets/101cruise-logo.png"
  ]


