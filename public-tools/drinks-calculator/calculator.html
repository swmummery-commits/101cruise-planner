<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drinks Calculator | 101cruise</title>
  <link rel="stylesheet" href="/css/brand-loading.css">
  <style>
    body {
      margin: 0;
      padding: 28px 16px 64px;
      background: #fff;
      color: #111;
      font-family: "Halyard Display", Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div id="101cruise-drinks-calculator" data-dc-calculator>
    <div class="brand-loading-panel" role="status" aria-live="polite">
      <span class="brand-loading-boxes brand-loading-boxes--large brand-loading-spinner" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></span>
      <p class="brand-loading-message">Hang tight! Just getting your info.</p>
    </div>
  </div>
  <script src="/js/usage-track.js"></script>
  <script>
    (function () {
      // Pretty URL /drinks-calculator is a Netlify rewrite; pathname is not the real folder.
      var path = location.pathname || "/";
      var base = /\/drinks-calculator\/?$/.test(path)
        ? "/public-tools/drinks-calculator/"
        : (path.replace(/[^/]*$/, "") || "./");
      var css = document.createElement("link");
      css.rel = "stylesheet";
      css.href = base + "calculator.css";
      document.head.appendChild(css);
      loadScript("/js/brand-loading.js", function () {
        var s = document.createElement("script");
        s.src = base + "calculator.js";
        s.onerror = function () {
          var mount = document.getElementById("101cruise-drinks-calculator");
          if (mount) {
            mount.innerHTML =
              '<p style="max-width:960px;margin:0 auto;color:#8a2f2f;">Could not load calculator.js from ' +
              s.src +
              ". Hard-refresh or check the deploy includes public-tools/drinks-calculator/.</p>";
          }
        };
        document.body.appendChild(s);
      });

      function loadScript(src, next) {
        var el = document.createElement("script");
        el.src = src;
        el.onload = next;
        el.onerror = function () {
          next();
        };
        document.body.appendChild(el);
      }
    })();
  </script>
</body>
</html>
