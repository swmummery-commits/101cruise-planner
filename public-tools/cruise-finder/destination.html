<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cruise Destination | 101cruise</title>
  <link rel="stylesheet" href="/css/brand-loading.css" id="brand-loading-css">
  <style>
    body {
      margin: 0;
      padding: 28px 16px 64px;
      background: #fff;
      color: #111;
      font-family: "Halyard Display", Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div
    id="101cruise-cruise-destination"
    data-cf-destination
    data-destination-experience-version="dx-route-fix-1"
  >
    <div class="brand-loading-panel" role="status" aria-live="polite">
      <span class="brand-loading-boxes brand-loading-boxes--large brand-loading-spinner" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></span>
      <p class="brand-loading-message">Hang tight! Just getting your info.</p>
    </div>
  </div>
  <script>
    (function () {
      var DX_VERSION = "dx-route-fix-1";
      var path = location.pathname || "/";
      var base = /\/cruise-destination\/?$/.test(path)
        ? "/public-tools/cruise-finder/"
        : (path.replace(/[^/]*$/, "") || "./");

      function versioned(src) {
        if (!src || /[?&]v=/.test(src)) return src;
        return src + (src.indexOf("?") === -1 ? "?" : "&") + "v=" + encodeURIComponent(DX_VERSION);
      }

      function fail(msg) {
        var mount = document.getElementById("101cruise-cruise-destination");
        if (mount) {
          mount.innerHTML =
            '<p style="max-width:760px;margin:0 auto;color:#8a2f2f;">' + msg + "</p>";
        }
      }

      function loadScript(src, next) {
        var el = document.createElement("script");
        el.src = versioned(src);
        el.onload = next;
        el.onerror = function () {
          fail("Could not load " + src);
        };
        document.body.appendChild(el);
      }

      var css = document.createElement("link");
      css.rel = "stylesheet";
      css.href = versioned(base + "destination.css");
      document.head.appendChild(css);

      var dxCss = document.createElement("link");
      dxCss.rel = "stylesheet";
      dxCss.href = versioned("/css/destination-experience.css");
      document.head.appendChild(dxCss);

      var brandCss = document.createElement("link");
      brandCss.rel = "stylesheet";
      brandCss.href = versioned("/css/brand-loading.css");
      document.head.appendChild(brandCss);

      loadScript("/js/brand-loading.js", function () {
        loadScript(base + "destinations.js", function () {
          loadScript(base + "destination-content.js", function () {
            loadScript(base + "approved-cruise-lines.js", function () {
              loadScript(base + "destination-images.js", function () {
                loadScript(base + "hero-images.js", function () {
                  loadScript("/js/destination-experience-data.js", function () {
                    loadScript("/js/destination-experience-media.js", function () {
                      loadScript("/js/destination-experience-image-loader.js", function () {
                        loadScript("/js/destination-experience-components.js", function () {
                          loadScript("/js/destination-experience.js", function () {
                            loadScript(base + "destination.js", function () {});
                          });
                        });
                      });
                    });
                  });
                });
              });
            });
          });
        });
      });
    })();
  </script>
</body>
</html>
