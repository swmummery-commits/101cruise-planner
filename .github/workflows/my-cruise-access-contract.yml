name: My Cruise access contract

on:
  push:
    branches: [main]
    paths:
      - 'netlify/functions/customer-access.js'
      - 'netlify/functions/customer-refresh-booking.js'
      - 'netlify/functions/customer-booking-access-service.js'
      - 'netlify/functions/lib/customer-session-auth.js'
      - 'js/customer-session-preflight.js'
      - 'scripts/test-my-cruise-access-contract.mjs'
      - '.github/workflows/my-cruise-access-contract.yml'
  pull_request:
    paths:
      - 'netlify/functions/customer-access.js'
      - 'netlify/functions/customer-refresh-booking.js'
      - 'netlify/functions/customer-booking-access-service.js'
      - 'netlify/functions/lib/customer-session-auth.js'
      - 'js/customer-session-preflight.js'
      - 'scripts/test-my-cruise-access-contract.mjs'
      - '.github/workflows/my-cruise-access-contract.yml'

permissions:
  contents: read

jobs:
  access-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify My Cruise authentication contract
        run: node scripts/test-my-cruise-access-contract.mjs
