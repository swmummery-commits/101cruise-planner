name: Princess Weekly Maintenance (dry-run)

on:
  workflow_dispatch:

concurrency:
  group: princess-weekly-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  princess-weekly-dry-run:
    runs-on:
      - self-hosted
      - princess-local-mac
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PRINCESS_WEEKLY_RECONCILIATION_ENABLED: "false"
      PRINCESS_DISCOVERY_WRITE_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Run Princess weekly maintenance dry-run
        run: npm run princess:weekly-maintenance

      - name: Upload dry-run report artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: princess-weekly-maintenance-report
          path: reports/princess-weekly-maintenance-*.json
          if-no-files-found: ignore
          retention-days: 30
