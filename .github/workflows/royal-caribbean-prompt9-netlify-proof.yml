name: Royal Caribbean Prompt 9 Netlify Proof

on:
  push:
    branches:
      - feat/royal-caribbean-final-catchup
  workflow_dispatch:

concurrency:
  group: royal-caribbean-prompt9-netlify-proof
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  netlify-runtime-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://deploy-preview-1--admirable-tiramisu-d4da8a.netlify.app
      CONFIRMATION: RC_PROMPT9_PREVIEW_PROOF_2026
      PROOF_VERSION: rc-prompt9-netlify-proof-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Verify runtime-proof unit tests
        run: npm run test:royal-caribbean-runtime-proof

      - name: Wait for exact Netlify Deploy Preview and run bounded smoke
        shell: bash
        run: |
          set -euo pipefail
          payload=$(printf '{"confirmation":"%s"}' "$CONFIRMATION")
          ok=0
          for i in $(seq 1 60); do
            status=$(curl -sS -o /tmp/rc-smoke.json -w '%{http_code}' \
              -X POST "$BASE_URL/.netlify/functions/royal-caribbean-prompt9-preview-smoke" \
              -H 'Content-Type: application/json' \
              --data "$payload" || true)
            echo "Smoke attempt $i: HTTP $status"
            if [ "$status" = "200" ] && PROOF_VERSION="$PROOF_VERSION" node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("/tmp/rc-smoke.json","utf8"));process.exit(j.ok===true&&j.proof_version===process.env.PROOF_VERSION&&j.graphql_valid===true&&j.writes_performed===false?0:1)'; then
              ok=1
              break
            fi
            sleep 10
          done
          cat /tmp/rc-smoke.json || true
          if [ "$ok" != "1" ]; then
            echo "Exact Netlify Deploy Preview proof version never became healthy"
            exit 1
          fi

      - name: Dispatch authoritative background proof and poll result
        shell: bash
        run: |
          set -euo pipefail
          run_id="rc-prompt9-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          payload=$(printf '{"confirmation":"%s","run_id":"%s"}' "$CONFIRMATION" "$run_id")
          status=$(curl -sS -o /tmp/rc-dispatch.json -w '%{http_code}' \
            -X POST "$BASE_URL/.netlify/functions/royal-caribbean-prompt9-preview-proof-background" \
            -H 'Content-Type: application/json' \
            --data "$payload" || true)
          echo "Background dispatch HTTP $status"
          cat /tmp/rc-dispatch.json || true
          if [ "$status" != "202" ] && [ "$status" != "200" ]; then
            exit 1
          fi

          completed=0
          for i in $(seq 1 180); do
            status=$(curl -sS -o /tmp/rc-result.json -w '%{http_code}' \
              "$BASE_URL/.netlify/functions/royal-caribbean-prompt9-preview-result?run_id=${run_id}&confirmation=${CONFIRMATION}" || true)
            echo "Result poll $i: HTTP $status"
            if [ "$status" = "200" ]; then
              set +e
              node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/rc-result.json','utf8'));
          const r=j.result||{};
          if (j.status === 'completed' && (r.status === 'failed' || r.ok === false)) {
            console.error('Netlify background proof reported failure:', JSON.stringify({
              error_code: r.error_code || null,
              safe_error: r.safe_error || null,
              actual_writes: r.actual_writes ?? null
            }));
            process.exit(2);
          }
          if (j.status === 'completed' && r.actual_writes === 0 && r.royal_caribbean_netlify_background_runtime_ok === true && r.enumeration_health?.royal_caribbean_source_enumeration_ok === true && r.weekly_health?.weekly_maintenance_healthy === true) {
            process.exit(0);
          }
          process.exit(1);
          NODE
              rc=$?
              set -e
              if [ "$rc" = "0" ]; then
                completed=1
                break
              elif [ "$rc" = "2" ]; then
                cat /tmp/rc-result.json
                exit 1
              fi
            fi
            sleep 5
          done
          cat /tmp/rc-result.json || true
          if [ "$completed" != "1" ]; then
            echo "Authoritative background proof did not complete healthy"
            exit 1
          fi

      - name: Confirm proof stayed read-only
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const smoke=JSON.parse(fs.readFileSync('/tmp/rc-smoke.json','utf8'));
          const result=JSON.parse(fs.readFileSync('/tmp/rc-result.json','utf8'));
          if (smoke.writes_performed !== false) throw new Error('Smoke write safety failed');
          if ((result.result||{}).actual_writes !== 0) throw new Error('Background write safety failed');
          console.log(JSON.stringify({
            smoke: {
              proof_version: smoke.proof_version,
              graphql_valid: smoke.graphql_valid,
              upstream_http_status: smoke.upstream_http_status,
              sample_group_count: smoke.sample_group_count,
              fleet_count: smoke.fleet_count,
              duration_ms: smoke.duration_ms
            },
            background: result.result
          }, null, 2));
          NODE
