name: Princess Source Smoke (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  princess-source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run read-only Princess source smoke
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PRINCESS_DISCOVERY_WRITE_ENABLED: "false"
          PRINCESS_WEEKLY_RECONCILIATION_ENABLED: "false"
        run: node scripts/princess-source-smoke-ci.mjs
