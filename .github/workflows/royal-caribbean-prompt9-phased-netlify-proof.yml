name: Royal Caribbean Prompt 9 Phased Netlify Proof

on:
  push:
    branches:
      - feat/royal-caribbean-final-catchup
  workflow_dispatch:

concurrency:
  group: royal-caribbean-prompt9-phased-netlify-proof
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phased-netlify-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_URL: https://deploy-preview-1--admirable-tiramisu-d4da8a.netlify.app
      CONFIRMATION: RC_PROMPT9_PHASED_PROOF_2026
      PROTOCOL_VERSION: rc-prompt9-phased-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Run phased runtime unit tests
        run: |
          node scripts/test-royal-caribbean-phased-runtime.mjs
          npm run test:royal-caribbean-runtime-proof

      - name: Wait for exact phased Deploy Preview
        shell: bash
        run: |
          set -euo pipefail
          run_id="deploy-check-${GITHUB_RUN_ID}"
          ok=0
          for i in $(seq 1 90); do
            status=$(curl -sS -o /tmp/state.json -w '%{http_code}' \
              "$BASE_URL/.netlify/functions/royal-caribbean-prompt9-phased-state?run_id=${run_id}&confirmation=${CONFIRMATION}" || true)
            if [ "$status" = "202" ] || [ "$status" = "200" ]; then
              if PROTOCOL_VERSION="$PROTOCOL_VERSION" node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("/tmp/state.json","utf8"));process.exit(j.protocol_version===process.env.PROTOCOL_VERSION&&j.actual_writes===0?0:1)'; then
                ok=1; break
              fi
            fi
            echo "Waiting for phased-v1 deploy: attempt $i HTTP $status"
            sleep 10
          done
          cat /tmp/state.json || true
          test "$ok" = "1"

      - name: Reconfirm bounded Netlify GraphQL smoke
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/smoke.json -w '%{http_code}' \
            -X POST "$BASE_URL/.netlify/functions/royal-caribbean-prompt9-preview-smoke" \
            -H 'Content-Type: application/json' \
            --data '{"confirmation":"RC_PROMPT9_PREVIEW_PROOF_2026"}')
          cat /tmp/smoke.json
          test "$status" = "200"
          node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("/tmp/smoke.json","utf8"));if(!(j.graphql_valid===true&&j.writes_performed===false))process.exit(1)'

      - name: Execute six bounded source phases sequentially
        shell: bash
        run: |
          set -euo pipefail
          run_id="rc-phased-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "$run_id" > /tmp/run_id
          phases=(a-25 a-50 a-100 b-25 b-50 b-100)
          for phase in "${phases[@]}"; do
            echo "Dispatching $phase"
            payload=$(printf '{"confirmation":"%s","run_id":"%s","phase_id":"%s","request_delay_ms":100}' "$CONFIRMATION" "$run_id" "$phase")
            status=$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' \
              -X POST "$BASE_URL/.netlify/functions/royal-caribbean-prompt9-phased-source-background" \
              -H 'Content-Type: application/json' --data "$payload" || true)
            echo "Dispatch $phase HTTP $status"
            test "$status" = "202" || test "$status" = "200"

            complete=0
            for i in $(seq 1 180); do
              status=$(curl -sS -o /tmp/phase-state.json -w '%{http_code}' \
                "$BASE_URL/.netlify/functions/royal-caribbean-prompt9-phased-state?run_id=${run_id}&confirmation=${CONFIRMATION}" || true)
              if [ "$status" = "500" ]; then cat /tmp/phase-state.json; exit 1; fi
              if [ "$status" = "200" ] && PHASE="$phase" node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("/tmp/phase-state.json","utf8"));process.exit(j.state?.last_completed_phase===process.env.PHASE?0:1)'; then
                complete=1; break
              fi
              sleep 5
            done
            cat /tmp/phase-state.json
            test "$complete" = "1"
          done

      - name: Run final frozen-source reconciliation
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(cat /tmp/run_id)
          payload=$(printf '{"confirmation":"%s","run_id":"%s"}' "$CONFIRMATION" "$run_id")
          status=$(curl -sS -o /tmp/final-dispatch.json -w '%{http_code}' \
            -X POST "$BASE_URL/.netlify/functions/royal-caribbean-prompt9-phased-finalize-background" \
            -H 'Content-Type: application/json' --data "$payload" || true)
          echo "Finalizer dispatch HTTP $status"
          test "$status" = "202" || test "$status" = "200"

          complete=0
          for i in $(seq 1 180); do
            status=$(curl -sS -o /tmp/final-state.json -w '%{http_code}' \
              "$BASE_URL/.netlify/functions/royal-caribbean-prompt9-phased-state?run_id=${run_id}&confirmation=${CONFIRMATION}" || true)
            if [ "$status" = "500" ]; then cat /tmp/final-state.json; exit 1; fi
            if [ "$status" = "200" ] && node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("/tmp/final-state.json","utf8"));const c=j.state?.compact||{};process.exit(j.status==="completed"&&c.actual_writes===0&&c.phase_count===6&&c.royal_caribbean_netlify_background_runtime_ok===true&&c.phased_enumeration_health?.ok===true?0:1)'; then
              complete=1; break
            fi
            sleep 5
          done
          cat /tmp/final-state.json
          test "$complete" = "1"

      - name: Verify all phases and write safety
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const state=JSON.parse(fs.readFileSync('/tmp/final-state.json','utf8'));
          if (state.actual_writes !== 0) throw new Error('state writes not zero');
          if ((state.state?.compact?.actual_writes ?? -1) !== 0) throw new Error('compact writes not zero');
          if ((state.phases||[]).length !== 6) throw new Error('not all six phases persisted');
          console.log(JSON.stringify({
            protocol_version: state.protocol_version,
            phases: state.phases,
            final: state.state.compact
          }, null, 2));
          NODE
