<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Featured Cruise Review Fixture</title>
  <link rel="stylesheet" href="../../css/destination-experience.css">
  <link rel="stylesheet" href="../../css/public-cruise.css">
</head>
<body>
  <main class="public-cruise-shell">
    <div class="public-cruise-page">
      <div id="public-cruise-app" class="public-cruise-body"></div>
    </div>
  </main>
  <script src="../../js/newsletter-cruise-shared.js"></script>
  <script src="../../js/destination-experience-data.js"></script>
  <script src="../../js/destination-experience-image-loader.js"></script>
  <script src="../../js/destination-experience-featured-cruise-data.js"></script>
  <script src="../../js/destination-experience-components.js"></script>
  <script src="../../js/destination-experience-featured-cruise-components.js"></script>
  <script src="../../js/destination-experience.js"></script>
  <script>
    (async function () {
      var params = new URLSearchParams(location.search);
      var fixture = params.get("fixture") || "sirena";
      var file =
        fixture === "sparse"
          ? "../fixtures/featured-cruise-sparse-payload.json"
          : "../fixtures/featured-cruise-sirena-payload.json";
      var response = await fetch(file);
      var cruise = await response.json();
      await DestinationExperienceApp.bootFeaturedCruise({
        mount: document.getElementById("public-cruise-app"),
        cruise: cruise
      });
      document.documentElement.classList.add("dx-reduced-motion");
      document.querySelectorAll("[data-dx-reveal]").forEach(function (el) {
        el.classList.add("is-visible");
      });
    })();
  </script>
</body>
</html>
