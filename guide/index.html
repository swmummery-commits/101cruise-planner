<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d7d7d4">
  <meta name="color-scheme" content="light">
  <title>101cruise Digital Guide</title>
  <meta name="description" content="The 101cruise digital guide.">
  <link rel="stylesheet" href="./guide.css?v=20260810-1640">
  <link rel="stylesheet" href="./viewer-v2.css?v=20260810-1640">
  <link rel="stylesheet" href="./viewer-v3.css?v=20260810-1640">
</head>
<body>
  <main class="guide-shell" aria-label="101cruise digital guide">
    <header class="guide-toolbar">
      <a class="brand" href="https://101cruise.com.au/" target="_top" aria-label="Back to 101cruise">101cruise</a>
      <div class="toolbar-actions">
        <button class="nav-button toolbar-nav" id="prevButton" type="button" aria-label="Previous page">‹</button>
        <div class="page-status" id="pageStatus" aria-live="polite">Cover</div>
        <button class="nav-button toolbar-nav" id="nextButton" type="button" aria-label="Next page">›</button>
        <button class="fullscreen-button" id="fullscreenButton" type="button">Full screen</button>
      </div>
    </header>

    <section class="viewer-stage" id="viewerStage" aria-label="Digital booklet viewer">
      <div class="book-area">
        <button class="edge-hit edge-left" id="stagePrev" type="button" aria-label="Previous page"></button>
        <div class="book" id="book" role="group" aria-roledescription="digital booklet">
          <div class="page-slot left-slot" id="leftSlot"></div>
          <div class="page-slot right-slot" id="rightSlot"></div>
          <div class="single-slot" id="singleSlot"></div>
          <div class="spine" aria-hidden="true"></div>
        </div>
        <button class="edge-hit edge-right" id="stageNext" type="button" aria-label="Next page"></button>
      </div>
    </section>

    <footer class="guide-footer">
      <div class="progress-track" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>
      <p>Use the arrows, swipe, or your keyboard to move through the guide.</p>
    </footer>
  </main>
  <script src="./viewer-v3.js?v=20260810-1640" defer></script>
</body>
</html>
