<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Destination | 101cruise</title>
  <meta name="description" content="Explore cruise destinations with 101cruise.">
  <!-- Sprint 11C: content loaded from /.netlify/functions/public-destination -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="101cruise">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <link rel="stylesheet" href="/css/brand-loading.css">
  <link rel="stylesheet" href="/css/public-cruise.css">
  <link rel="stylesheet" href="/css/public-destination.css?v=20260805k">
  <script>
    (function () {
      var parts = (location.pathname || "/").split("/").filter(Boolean);
      var idx = parts.indexOf("destination");
      var slug = idx >= 0 ? decodeURIComponent(parts[idx + 1] || "").toLowerCase() : "";
      var living = { alaska: true };
      if (!slug || living[slug]) return;
      var params = new URLSearchParams(location.search);
      params.set("destination", slug);
      location.replace("/cruise-destination?" + params.toString());
    })();
  </script>
</head>
<body>
  <main class="public-cruise-shell dest-shell">
    <div class="public-cruise-page dest-shell-page">
      <!-- Page shell header — shared 101cruise contact chrome -->
      <header class="public-cruise-header">
        <a class="public-cruise-logo-link" href="https://www.101cruise.com.au" aria-label="101cruise home">
          <img class="public-cruise-logo" src="/assets/101cruise-logo-black.png" alt="101cruise" width="120" height="120">
        </a>
        <nav class="public-cruise-contact-nav" aria-label="Contact">
          <a class="public-cruise-nav-link" href="mailto:paul@101cruise.com.au">CONTACT ME</a>
          <a class="public-cruise-nav-link" href="tel:+61411224036">REQUEST A CALL</a>
          <a class="public-cruise-nav-link" href="https://www.101cruise.com.au/quote">REQUEST A QUOTE</a>
        </nav>
      </header>

      <div id="public-destination-app" class="public-cruise-body">
        <div class="brand-loading-panel public-cruise-loading-panel" role="status" aria-live="polite">
          <span class="brand-loading-boxes brand-loading-boxes--large brand-loading-spinner" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></span>
          <p class="brand-loading-message">Hang tight! Just getting your info.</p>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/brand-loading.js"></script>
  <script src="/js/destination-page-data.js?v=20260805k"></script>
  <script src="/js/public-destination.js?v=20260805k"></script>
</body>
</html>
